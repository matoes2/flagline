/* Sodium-lamp dusk: ink-blue panels, one amber signal color for the active thing,
   condensed numerals for everything you count. Single dark look by design. */
:root{
  --bg:#0A0D14;--bg2:#10151F;--bg3:#171E2C;--bg4:#212B3E;
  --line:rgba(150,170,210,.13);--line2:rgba(150,170,210,.26);
  --fg:#EDF0F6;--fg2:#A9B2C6;--fg3:#7D88A1;
  --lamp:#FFB43B;--lamp-ink:#1B1204;--lampd:rgba(255,180,59,.14);
  --rest:#6EC8FF;--restd:rgba(110,200,255,.14);
  --ok:#4FE0A0;--okd:rgba(79,224,160,.14);--bad:#FF6B7A;--badd:rgba(255,107,122,.14);
  --disp:'Barlow Condensed','Arial Narrow','Roboto Condensed','Helvetica Neue',sans-serif;
  --body:'Manrope',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
h1,h2,h3,h4,p{margin:0}
.ic{display:block;flex:none}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.view{position:relative;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 28px}
.muted{color:var(--fg3)}.sm{font-size:13px}.center{text-align:center}.pad{padding-left:0}

/* ---------- type ---------- */
.kick{font-size:11px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--fg3)}
.kick.lamp{color:var(--lamp)}.kick.cool{color:var(--rest)}.kick.ok{color:var(--ok)}
.title{font-family:var(--disp);font-size:38px;line-height:1;font-weight:600;text-transform:uppercase;letter-spacing:.015em;margin-top:4px;text-wrap:balance}
.h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.h4{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);margin:18px 0 8px;display:flex;justify-content:space-between}
.lead{font-size:15px;line-height:1.55;color:var(--fg2)}
.empty{color:var(--fg3);text-align:center;padding:26px 0}.empty.sm{padding:6px 0 0;text-align:left;font-size:13px}
.foot{font-size:12.5px;color:var(--fg3);margin-top:18px;line-height:1.5}
b{font-weight:800}

/* ---------- layout bits ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 0 14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg)}
.brand .ic{color:var(--lamp)}
.top-r{display:flex;align-items:center;gap:10px}
.date{font-size:13px;color:var(--fg3);font-weight:600}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
.card.win{border-color:rgba(79,224,160,.35);background:linear-gradient(180deg,rgba(79,224,160,.07),var(--bg2))}
.row-b{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:3px 10px;border-radius:14px;background:var(--bg3);color:var(--fg2);font-size:12px;font-weight:700;border:1px solid var(--line);line-height:1.25}
.chip.lamp{background:var(--lampd);color:var(--lamp);border-color:rgba(255,180,59,.3)}
.chip.ok{background:var(--okd);color:var(--ok);border-color:rgba(79,224,160,.3)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden}.bar i{display:block;height:100%;background:var(--lamp);border-radius:3px}

/* ---------- buttons ---------- */
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}.btnrow.col{flex-direction:column}.btnrow.pad{margin:0 0 12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:800;font-size:15px;background:var(--bg3);border:1px solid var(--line2);color:var(--fg);flex:1 1 auto;white-space:nowrap}
.btn.primary{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink);box-shadow:0 8px 24px -10px rgba(255,180,59,.7)}
.btn.ghost{background:var(--bg3)}
.btn.danger{background:var(--badd);border-color:rgba(255,107,122,.35);color:var(--bad)}
.btn.big{height:56px;font-size:17px;border-radius:16px;flex:1 1 100%}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:12px;flex:0 0 auto}
.btn:active,.lcard:active,.wrow:active,.prow:active,.swap:active,.rc:active{transform:scale(.98)}
.linkbtn{display:inline-flex;align-items:center;gap:2px;color:var(--lamp);font-weight:800;font-size:13px;padding:4px 0 4px 8px}

/* ---------- tab bar ---------- */
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,13,20,.96);border-top:1px solid var(--line)}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--fg3)}
.tabs button.on{color:var(--lamp)}
.tabs button.on::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--lamp)}

/* ---------- today ---------- */
.welcome{border-color:rgba(255,180,59,.3);background:radial-gradient(100% 120% at 100% 0%,rgba(255,180,59,.12),transparent 60%),var(--bg2)}
.welcome h2{font-family:var(--disp);font-size:30px;line-height:1.02;font-weight:600;margin:6px 0 8px;text-wrap:balance}
.welcome p{color:var(--fg2);font-size:14.5px}
.hero{position:relative;display:flex;flex-direction:column;gap:10px;padding:20px 18px 18px;border-radius:24px;background:radial-gradient(120% 90% at 100% 0%,rgba(255,180,59,.17),transparent 55%),linear-gradient(180deg,var(--bg3),var(--bg2));border:1px solid var(--line2);margin-bottom:14px;overflow:hidden}
.hero.rest{background:radial-gradient(120% 90% at 100% 0%,rgba(110,200,255,.14),transparent 55%),linear-gradient(180deg,var(--bg3),var(--bg2))}
.hero.done{background:radial-gradient(120% 90% at 100% 0%,rgba(79,224,160,.14),transparent 55%),linear-gradient(180deg,var(--bg3),var(--bg2))}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-title{font-family:var(--disp);font-size:36px;line-height:1;font-weight:600;text-wrap:balance}
.hero-sub{color:var(--fg2);font-size:14px}
.hero .btnrow{margin-top:6px}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:4px -18px 0;padding:2px 18px 4px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{flex:0 0 100px;display:flex;flex-direction:column;gap:6px}
.thumb svg{background:rgba(0,0,0,.24);border-radius:12px;padding:4px 3px;border:1px solid var(--line)}
.thumb span{font-size:11px;line-height:1.2;color:var(--fg2);font-weight:600}
.lvname{font-family:var(--disp);font-size:30px;font-weight:600;line-height:1.05;margin-top:2px}
.seg7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:14px 0 8px}
.seg7 i{position:relative;height:8px;border-radius:4px;background:var(--bg4);overflow:hidden}
.seg7 i.on{background:var(--lamp)}
.seg7 i.cur::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--lamp)}
.lvmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--fg3);font-weight:600}
.nextms{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:14px;background:var(--bg3);border:1px solid var(--line)}
.nextms .ic{color:var(--lamp)}
.nextms div{flex:1;min-width:0}.nextms small{display:block;color:var(--fg3);font-size:12px}.nextms b{font-size:14.5px;line-height:1.25}
.nextms.win{background:var(--okd);border-color:rgba(79,224,160,.3)}.nextms.win .ic{color:var(--ok)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.wd small{font-size:11px;color:var(--fg3);letter-spacing:.06em}
.wd i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg4);color:var(--lamp-ink)}
.wd.plan i{border-style:dashed;border-color:rgba(255,180,59,.5)}
.wd.done i{background:var(--lamp);border-color:var(--lamp)}
.wd.today small{color:var(--lamp)}
.wd.today i{box-shadow:0 0 0 4px var(--lampd)}

/* ---------- path ---------- */

.lv-t{flex:1;min-width:0}.lv-t b{display:block;font-size:16.5px}.lv-t small{display:block;color:var(--fg3);font-size:12.5px;line-height:1.3}
.lv-s{display:flex;align-items:center;gap:6px;color:var(--fg3)}

.wlist,.mlist{display:flex;flex-direction:column;gap:8px}

.wt{flex:1;min-width:0;color:var(--fg)}.wt b{display:block;font-size:14.5px}.wt small{display:block;color:var(--fg3);font-size:12px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:14px;background:var(--bg3);border:1px solid transparent}
.mrow.done{background:var(--okd)}

.mchk.static{opacity:.8}
.mt{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:1.3}.mt small{display:block;font-size:11.5px;font-weight:600}

/* ---------- library ---------- */
.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px;background:var(--bg2);border:1px solid var(--line2);color:var(--fg3)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px;color:var(--fg)}
.chiprow{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 4px;padding:2px 16px;scrollbar-width:none}.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--bg2);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--fg2)}
.fchip.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.lcard{display:flex;flex-direction:column;gap:2px;padding:8px 8px 12px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);text-align:left}
.lfig{background:var(--bg3);border-radius:12px;padding:4px;margin-bottom:8px}
.lcard b{font-size:14px;line-height:1.2;padding:0 4px}.lcard small{font-size:11.5px;color:var(--fg3);padding:0 4px;font-weight:600}

/* ---------- progress ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.stats.three{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:32px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.stat b em{font-style:normal;font-size:16px;color:var(--fg3)}
.stat small{display:block;font-size:11px;color:var(--fg3);font-weight:700;margin-top:5px;letter-spacing:.04em}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:12px}
.hcol{display:grid;gap:4px}.hcol i{display:block;aspect-ratio:1;border-radius:5px;background:var(--bg3)}
.hcol i.h1{background:rgba(255,180,59,.5)}.hcol i.h2{background:var(--lamp)}.hcol i.fut{opacity:.35}
.heatkey{display:flex;justify-content:space-between;font-size:11px;color:var(--fg3);margin-top:8px;font-weight:600}
.hlist{display:flex;flex-direction:column;margin-top:8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow div{min-width:0}.hrow b{font-size:14px;display:block;line-height:1.25}.hrow small{display:block;color:var(--fg3);font-size:12px}
.hrow>span.muted{font-size:12.5px;flex:none}
.pb{font-family:var(--disp);font-size:26px;font-weight:600;color:var(--lamp);flex:none}.pb em{font-style:normal;font-size:13px;color:var(--fg3)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:12px 0;border-top:1px solid var(--line);text-align:left}
.setrow:first-of-type{border-top:0}
.setrow.col{flex-direction:column;align-items:stretch;gap:10px}.setrow.static{color:var(--fg3)}
.setrow b{display:block;font-size:14.5px;color:var(--fg)}.setrow small{display:block;font-size:12px;color:var(--fg3);margin-top:1px}
.sw{position:relative;width:48px;height:28px;border-radius:14px;background:var(--bg4);flex:none;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--fg2);transition:transform .15s}
.sw.on{background:var(--lamp)}.sw.on i{transform:translateX(20px);background:var(--lamp-ink)}
.segc{display:flex;gap:6px}
.segc button{flex:1;height:38px;text-align:center;border-radius:11px;background:var(--bg3);border:1px solid var(--line);font-weight:800;font-size:13px;color:var(--fg2)}
.segc button.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.bk{width:100%;margin-top:12px;padding:10px;border-radius:12px;background:var(--bg3);border:1px solid var(--line2);font:16px/1.4 ui-monospace,Menlo,monospace;resize:vertical;outline:0}
.plain{margin:10px 0 0;padding-left:18px;color:var(--fg2);font-size:14px;display:flex;flex-direction:column;gap:8px}
.srcs{display:flex;flex-direction:column;margin-top:8px}
.srcs a{display:flex;flex-direction:column;gap:1px;padding:10px 0;border-top:1px solid var(--line);color:var(--fg);text-decoration:none;font-size:14px;font-weight:600}
.srcs a:first-child{border-top:0}.srcs a small{color:var(--lamp);font-size:12px}

/* ---------- overlays, sheets ---------- */
.over{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 0;overflow:hidden}
#timer.over{z-index:60}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(3,5,9,.66);opacity:0;transition:opacity .2s}.scrim.in{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:92%;display:flex;flex-direction:column;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line2);transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.in{transform:none}
.sheet-h{position:relative;flex:none;height:34px;display:flex;justify-content:center;align-items:center}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line2)}
.sheet-h .x{position:absolute;right:12px;top:6px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--bg3);color:var(--fg2)}
.sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 18px 26px}
.sh-t{font-family:var(--disp);font-size:34px;line-height:1.02;font-weight:600;margin:6px 0 4px;text-wrap:balance}
.exhero{background:var(--bg3);border-radius:20px;padding:12px 10px;margin:4px 0 10px;border:1px solid var(--line)}
.figrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.figrow.n1{grid-template-columns:1fr}.figrow.n2{grid-template-columns:repeat(2,1fr)}
.figbox{background:var(--bg3);border-radius:14px;padding:6px 6px 4px;text-align:center;border:1px solid var(--line)}
.figbox small{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);font-weight:800;margin-top:2px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;position:relative;padding-left:34px;color:var(--fg2);font-size:14.5px;line-height:1.5}
.steps .ic{display:inline-block;vertical-align:-3px;color:var(--lamp);margin:0 1px}
.lead+.steps{margin-top:16px}
.instnote{margin-top:16px;line-height:1.5}
.install{display:flex;align-items:center;gap:12px;padding:12px 8px 12px 14px;border-color:rgba(255,180,59,.28);background:radial-gradient(120% 140% at 0% 0%,rgba(255,180,59,.10),transparent 60%),var(--bg2)}
.inst-ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--lampd);color:var(--lamp)}
.inst-t{flex:1;min-width:0}.inst-t b{display:block;font-size:14.5px;line-height:1.2}.inst-t small{display:block;font-size:12px;color:var(--fg3);margin-top:2px;line-height:1.35}
.inst-x{flex:none;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--fg3)}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--lampd);color:var(--lamp);font-family:var(--disp);font-weight:700;font-size:15px;display:grid;place-items:center}
.ticks,.crosses{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ticks li,.crosses li{display:flex;gap:10px;align-items:flex-start;color:var(--fg2);font-size:14.5px}
.ticks .ic{color:var(--ok);margin-top:3px}.crosses .ic{color:var(--bad);margin-top:3px}
.kv{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);margin-top:12px;font-size:14px}
.kv small{width:74px;flex:none;color:var(--fg3);font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px;padding-top:3px}
.kv span{color:var(--fg2)}
.swaprow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swap{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:var(--bg3);border:1px solid var(--line);text-align:left;font-weight:700;font-size:13.5px;line-height:1.25}
.swap small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--lamp);font-weight:800}
.swap .ic{color:var(--lamp)}
.rotnote{font-size:13px;line-height:1.45;color:var(--fg3);margin:0 0 10px}
.wsw{margin:12px 0 2px}.wsw button{height:44px;font-family:var(--disp);font-size:22px;font-weight:600}
.also{display:inline-block;margin-top:5px;padding:1px 8px;border-radius:9px;background:var(--bg4);color:var(--fg2);font-size:11px;font-weight:700}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:16px;background:var(--bg3);border:1px solid var(--line);color:var(--fg3)}
.pf{flex:0 0 78px;background:rgba(0,0,0,.22);border-radius:12px;padding:2px}
.pt{flex:1;min-width:0;color:var(--fg)}.pt b{display:block;font-size:14.5px;line-height:1.2}.pt small{display:block;color:var(--fg3);font-size:12px;margin-top:2px}
.qb{margin-top:16px}.qb>b{display:block;font-size:14.5px;margin-bottom:8px}
.qo{display:flex;flex-wrap:wrap;gap:8px}
.qo button{min-height:38px;padding:6px 14px;border-radius:19px;background:var(--bg3);border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--fg2);line-height:1.2}
.qo button.on{background:var(--lamp);border-color:var(--lamp);color:var(--lamp-ink)}
.qres{margin-top:20px;padding:16px;border-radius:16px;background:var(--lampd);border:1px solid rgba(255,180,59,.3);display:flex;flex-direction:column;gap:2px}
.qres small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--lamp)}.qres b{font-family:var(--disp);font-size:28px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,10px);z-index:90;max-width:88%;text-align:center;padding:11px 18px;border-radius:14px;background:var(--bg4);border:1px solid var(--line2);font-weight:800;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0)}

/* ---------- figures ---------- */
.fig{display:block;width:100%;height:auto;overflow:visible}
.f-limb,.f-torso{fill:none;stroke:var(--fg);stroke-width:calc(3.6px*var(--k,1));stroke-linecap:round;stroke-linejoin:round}
.f-far{stroke:#6F7C99}
.f-head{fill:var(--lamp);stroke:none}
.f-ground{stroke:rgba(150,170,210,.38);stroke-width:2;fill:none;stroke-linecap:round}
.f-prop{fill:rgba(150,170,210,.13);stroke:rgba(150,170,210,.5);stroke-width:1.6}
.f-wall{stroke:rgba(150,170,210,.55);stroke-width:2.2;fill:none}
.f-hatch{stroke:rgba(150,170,210,.3);stroke-width:1.4;fill:none;stroke-linecap:round}
.f-pole{stroke:rgba(150,170,210,.6);stroke-width:3.6;stroke-linecap:round;fill:none}
.anim{display:grid}
.anim>svg{grid-area:1/1}
.anim.n2>.a1{animation:fa2 2s steps(1,end) infinite}
.anim.n2>.a2{animation:fb2 2s steps(1,end) infinite}
.anim.n3>.a1{animation:fa3 2.7s steps(1,end) infinite}
.anim.n3>.a2{animation:fb3 2.7s steps(1,end) infinite}
.anim.n3>.a3{animation:fc3 2.7s steps(1,end) infinite}
@keyframes fa2{0%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes fb2{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
@keyframes fa3{0%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes fb3{0%{opacity:0}33.3%{opacity:1}66.6%{opacity:0}100%{opacity:0}}
@keyframes fc3{0%{opacity:0}66.6%{opacity:1}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.anim>svg{animation:none!important}.anim>svg:not(.a1){display:none}}

/* ---------- runner ---------- */

.blk b{font-family:var(--disp);font-size:21px;letter-spacing:.08em;text-transform:uppercase;color:var(--lamp);font-weight:600}

.rc-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg3);font-family:var(--disp);font-weight:600;font-size:16px;color:var(--fg2);flex:none}

.rc-t{flex:1;min-width:0}.rc-t b{display:block;font-size:15px}.rc-t small{color:var(--fg3);font-size:12px;font-weight:600}
.rc-c{font-family:var(--disp);font-size:19px;color:var(--fg3);font-variant-numeric:tabular-nums;font-weight:600}
.rc.done .rc-c{color:var(--ok)}
.rcard.open{padding:14px;margin-bottom:10px;border-radius:22px;background:var(--bg2);border:1px solid rgba(255,180,59,.38);box-shadow:0 0 0 4px rgba(255,180,59,.05)}
.rc-top{display:flex;gap:12px;align-items:flex-start}
.rc-fig{flex:0 0 138px;background:var(--bg3);border-radius:16px;padding:6px 4px;border:1px solid var(--line)}
.rc-info{flex:1;min-width:0;padding-top:2px}.rc-info b{display:block;font-size:17px;font-weight:800;line-height:1.2}

.ibtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--fg3);flex:none;margin:-4px -4px 0 0}
.rc-sets{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 8px 6px 6px;border-radius:14px;background:var(--bg3);width:100%;text-align:left}
.srow .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--bg4);font-family:var(--disp);font-weight:600;font-size:16px;color:var(--fg2);flex:none}
.srow .sv{flex:1;font-size:14px;color:var(--fg2)}
.srow .sx{font-size:12px;color:var(--fg3);font-weight:800;padding:6px 4px}
.srow.done{background:var(--okd)}.srow.done .sn{background:var(--ok);color:#052E1A}
.srow.done .sv b{font-family:var(--disp);font-size:23px;font-weight:600;color:var(--fg)}
.srow.wait,.srow.skip{opacity:.5}
.srow.cur{background:var(--bg4);border:1px solid rgba(255,180,59,.4);padding:7px}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border-radius:12px;padding:3px;min-width:0}

.tb{background:var(--bg3);border:1px solid var(--line2);color:var(--lamp)}
.rc-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.swchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:16px;background:var(--bg3);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--fg2);line-height:1.2}
.swchip .ic{color:var(--lamp)}
.dock{flex:none;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:1px solid var(--line2)}

<body>
<div id="app"><main id="view" class="view"></main><nav id="tabs" class="tabs" role="tablist" aria-label="Sections"></nav></div>
<div id="runner" class="over" hidden></div>
<div id="timer" class="over" hidden></div>

<div id="toast" class="toast" hidden role="status"></div>
<noscript>Flagline needs JavaScript switched on to run.</noscript>
<script>
/* ---------- Stick-figure engine ----------
   Math coordinates: x right, y up, ground at y = 0. Angles in degrees, CCW from +x.
   A pose gives a hip (H) or shoulder (S) anchor, a torso angle t (hip -> shoulder),
   and limbs either by FK angles {a:[a1,a2]} or by IK targets {to:[x,y], b:+1|-1}.
   Limb bend b:+1 turns the first bone CCW from the hip->target line.            */
const FIG = (function () {
  const D = Math.PI / 180;
  const LEN = { head: 7, neck: 4, torso: 34, ua: 19, fa: 17, hand: 5, th: 26, sh: 25, ft: 9 };
  const dir = (a) => [Math.cos(a * D), Math.sin(a * D)];
  const add = (p, q) => [p[0] + q[0], p[1] + q[1]];
  const sc = (v, k) => [v[0] * k, v[1] * k];

  function ik(O, P, l1, l2, b) {
    const dx = P[0] - O[0], dy = P[1] - O[1];
    let d = Math.hypot(dx, dy);
    const mx = l1 + l2 - 0.01, mn = Math.abs(l1 - l2) + 0.01;
    d = Math.min(mx, Math.max(mn, d));
    const base = Math.atan2(dy, dx);
    const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const A = Math.acos(Math.max(-1, Math.min(1, c)));
    const a1 = base + (b || 1) * A;
    const J = [O[0] + l1 * Math.cos(a1), O[1] + l1 * Math.sin(a1)];
    const E = [O[0] + d * Math.cos(base), O[1] + d * Math.sin(base)];
    return [J, E];
  }
  function limb(O, spec, l1, l2) {
    if (spec.a) {
      const J = add(O, sc(dir(spec.a[0]), l1));
      return [J, add(J, sc(dir(spec.a[1]), l2))];
    }
    return ik(O, spec.to, l1, l2, spec.b);
  }

  function solve(p) {
    const T = LEN.torso, half = T / 2;
    const t = p.t == null ? 90 : p.t, tb = p.tb || 0;
    let H = p.H;
    if (!H && p.S) {
      const lo = dir(t), up = dir(t + tb);
      H = [p.S[0] - half * (lo[0] + up[0]), p.S[1] - half * (lo[1] + up[1])];
    }
    const M = add(H, sc(dir(t), half));
    const S = add(M, sc(dir(t + tb), half));
    const hdA = p.ha != null ? p.ha : t + tb + (p.hd || 0);
    const N = add(S, sc(dir(hdA), LEN.neck));
    const HC = add(N, sc(dir(hdA), LEN.head));
    const sw = p.sw || [0, 0], hw = p.hw || [0, 0];
    const dep = p.dep == null ? [-2.6, 1.2] : p.dep;

    const sN = [S[0] - sw[0] / 2, S[1] - sw[1] / 2], sF = [S[0] + sw[0] / 2, S[1] + sw[1] / 2];
    const hN = [H[0] - hw[0] / 2, H[1] - hw[1] / 2], hF = [H[0] + hw[0] / 2, H[1] + hw[1] / 2];
    const aSpec = p.A || { a: [270, 270] }, gSpec = p.G || { a: [270, 270] };
    const armN = limb(sN, aSpec, LEN.ua, LEN.fa);
    const legN = limb(hN, gSpec, LEN.th, LEN.sh);
    let armF, legF;
    if (p.A2) armF = limb(sF, p.A2, LEN.ua, LEN.fa);
    else { const a = limb(sF, aSpec, LEN.ua, LEN.fa); armF = a.map((q) => add(q, dep)); }
    if (p.G2) legF = limb(hF, p.G2, LEN.th, LEN.sh);
    else { const g = limb(hF, gSpec, LEN.th, LEN.sh); legF = g.map((q) => add(q, dep)); }

    const fa = p.f == null ? 0 : p.f, fa2 = p.f2 == null ? fa : p.f2;
    const toeN = add(legN[1], sc(dir(fa), LEN.ft)), toeF = add(legF[1], sc(dir(fa2), LEN.ft));
    const hn = p.hn || [null, null];
    const handN = add(armN[1], sc(dir(hn[0] == null ? faAng(armN) : hn[0]), LEN.hand));
    const handF = add(armF[1], sc(dir(hn[1] == null ? faAng(armF) : hn[1]), LEN.hand));
    return { H, M, S, N, HC, armN, armF, legN, legF, toeN, toeF, handN, handF, sN, sF, hN, hF };
  }
  function faAng(arm) { return Math.atan2(arm[1][1] - arm[0][1], arm[1][0] - arm[0][0]) / D; }

  const W = 200, HT = 130;
  function bounds(pose) {
    const R = solve(pose);
    const pts = [R.H, R.S, R.HC, ...R.armN, ...R.armF, ...R.legN, ...R.legF, R.toeN, R.toeF, R.handN, R.handF];
    const props = pose.props || [];
    let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
    const ext = (x, y, r) => { r = r || 0; minX = Math.min(minX, x - r); maxX = Math.max(maxX, x + r); minY = Math.min(minY, y - r); maxY = Math.max(maxY, y + r); };
    pts.forEach((p) => ext(p[0], p[1], 4));
    ext(R.HC[0], R.HC[1], LEN.head + 1);
    props.forEach((q) => {
      if (q.k === 'box') { ext(q.x1, 0); ext(q.x2, q.h); }
      if (q.k === 'wall') { ext(q.x, 0); ext(q.x, q.h || 110); }
      if (q.k === 'pole') { ext(q.x, q.y1); ext(q.x, q.y2); }
    });
    if (pose.g !== 0) ext(minX, 0);
    return { minX, maxX, minY, maxY };
  }
  function union(poses) {
    const b = poses.map(bounds);
    return { minX: Math.min(...b.map((x) => x.minX)), maxX: Math.max(...b.map((x) => x.maxX)), minY: Math.min(...b.map((x) => x.minY)), maxY: Math.max(...b.map((x) => x.maxY)) };
  }
  function svg(pose, o) {
    o = o || {};
    const k = o.thick || 1;
    const R = solve(pose);
    const props = pose.props || [];
    const bb = o.box || bounds(pose);
    const { minX, maxX, minY, maxY } = bb;
    const ground = pose.g !== 0;
    const bw = maxX - minX, bh = maxY - minY, m = 14;
    const s = Math.min(1.3, (W - 2 * m) / bw, (HT - 2 * m) / bh);
    const tx = W / 2 - s * (minX + maxX) / 2;
    const ty = HT / 2 + s * (minY + maxY) / 2;
    const f = (n) => Math.round(n * 100) / 100;
    const line = (a, b, cls) => `<path class="${cls}" d="M${f(a[0])} ${f(a[1])}L${f(b[0])} ${f(b[1])}"/>`;
    const chain = (pp, cls) => `<path class="${cls}" d="M${pp.map((q) => f(q[0]) + ' ' + f(q[1])).join('L')}"/>`;
    let g = '';
    props.forEach((q) => {
      if (q.k === 'box') g += `<rect class="f-prop" x="${q.x1}" y="0" width="${q.x2 - q.x1}" height="${q.h}" rx="2"/>`;
      if (q.k === 'wall') {
        const h = q.h || 110;
        g += `<path class="f-wall" d="M${q.x} 0L${q.x} ${h}"/>`;
        for (let y = 8; y < h; y += 14) g += `<path class="f-hatch" d="M${q.x} ${y}L${q.x + (q.side === -1 ? -7 : 7)} ${y - 7}"/>`;
      }
      if (q.k === 'pole') g += `<path class="f-pole" d="M${q.x} ${q.y1}L${q.x} ${q.y2}"/>`;
    });
    if (ground) g += `<path class="f-ground" d="M${f(minX - 6)} 0L${f(maxX + 6)} 0"/>`;
    g += chain([R.sF, ...R.armF, R.handF], 'f-limb f-far');
    g += chain([R.hF, ...R.legF, R.toeF], 'f-limb f-far');
    g += `<path class="f-torso" d="M${f(R.H[0])} ${f(R.H[1])}L${f(R.M[0])} ${f(R.M[1])}L${f(R.S[0])} ${f(R.S[1])}"/>`;
    g += line(R.S, R.N, 'f-limb');
    g += `<circle class="f-head" cx="${f(R.HC[0])}" cy="${f(R.HC[1])}" r="${LEN.head}"/>`;
    g += chain([R.hN, ...R.legN, R.toeN], 'f-limb');
    g += chain([R.sN, ...R.armN, R.handN], 'f-limb');
    const cls = 'fig' + (o.cls ? ' ' + o.cls : '');
    return `<svg class="${cls}" viewBox="0 0 ${W} ${HT}" style="--k:${k}" role="img" aria-hidden="true"><g transform="translate(${f(tx)} ${f(ty)}) scale(${f(s)} ${f(-s)})">${g}</g></svg>`;
  }
  return { solve, svg, bounds, union, LEN };
})();
if (typeof module !== 'undefined') module.exports = FIG;

/* ---------- Pose library (all figures face right; flags are front views on a pole) ---------- */
const POSES = (function () {
  const D = Math.PI / 180;
  const dv = (a) => [Math.cos(a * D), Math.sin(a * D)];
  const fk = (a, b) => ({ a: [a, b == null ? a : b] });
  const ik = (x, y, b) => ({ to: [x, y], b: b == null ? 1 : b });
  // straight body from an ankle to the shoulder (85 = torso 34 + leg 51)
  const lean = (ank, t, o) => {
    const u = dv(t);
    return Object.assign({ S: [ank[0] + 85 * u[0], ank[1] + 85 * u[1]], t, G: fk(t + 180) }, o || {});
  };
  const ARMS = fk(272, 286);
  const P = {};

  /* ---- prep ---- */
  P['jj-down'] = { H: [0, 51], t: 90, sw: [16, 0], hw: [8, 0], A: fk(250, 254), A2: fk(290, 286), G: fk(268), G2: fk(272), f: 200, f2: 340 };
  P['jj-up'] = { H: [0, 56], t: 90, sw: [16, 0], hw: [8, 0], A: fk(132, 112), A2: fk(48, 68), G: fk(243), G2: fk(297), f: 200, f2: 340 };
  P['catcow-neutral'] = { S: [0, 38], t: 16, tb: 0, A: fk(270), G: fk(270, 180), hn: [0, 0], f: 180, ha: 0 };
  P['catcow-cat'] = { S: [0, 38], t: 40, tb: -50, A: fk(270), G: fk(270, 180), hn: [0, 0], f: 180, ha: 290 };
  P['catcow-cow'] = { S: [0, 38], t: 2, tb: 30, A: fk(270), G: fk(270, 180), hn: [0, 0], f: 180, ha: 40 };
  P['child'] = { H: [-17, 13], t: 8, A: fk(-18, -8), hn: [0, 0], G: fk(336.5, 180), f: 180, ha: 305 };
  P['scap-up'] = lean([-80, 10.4], 19.2, { A: fk(270), hn: [0, 0], f: 290, tb: -16 });
  P['scap-down'] = lean([-80, 10.4], 19.2, { A: fk(270), hn: [0, 0], f: 290, tb: 12 });

  /* ---- push ---- */
  const wall = (x, h, side) => ({ k: 'wall', x, h, side });
  P['wallpu-top'] = lean([-17.7, 3], 72.4, { A: fk(0), hn: [90, 90], f: 0, props: [wall(44, 104, 1)] });
  P['wallpu-bot'] = lean([-17.7, 3], 62, { A: ik(44, 84, -1), hn: [90, 90], f: 0, props: [wall(44, 104, 1)] });
  const box = (x1, x2, h) => ({ k: 'box', x1, x2, h });
  P['incl-top'] = lean([-58.5, 10.4], 46.5, { A: fk(270), hn: [0, 0], f: 290, props: [box(-8, 38, 34)] });
  P['incl-bot'] = lean([-58.5, 10.4], 28, { A: ik(0, 36, -1), hn: [0, 0], f: 290, props: [box(-8, 38, 34)] });
  P['knee-top'] = { S: [0, 38], t: 35.7, A: fk(270), hn: [0, 0], G: fk(215.7, 165), f: 240 };
  P['knee-bot'] = { S: [10, 14], t: 10.6, A: ik(0, 2, -1), hn: [0, 0], G: fk(190.6, 165), f: 240 };
  P['pu-top'] = lean([-80, 10.4], 19.2, { A: fk(270), hn: [0, 0], f: 290 });
  P['pu-bot'] = lean([-75, 10.4], 2.4, { A: ik(0, 2, -1), hn: [0, 0], f: 290 });
  const dbox = [box(-98, -68, 30)];
  P['decl-top'] = lean([-85, 38.5], -1.7, { A: fk(270), hn: [0, 0], f: 290, props: dbox });
  P['decl-bot'] = lean([-85, 38.5], -14, { A: ik(0, 2, -1), hn: [0, 0], f: 290, props: dbox });
  P['pike-top'] = { S: [0, 38], t: 332, A: fk(270), hn: [0, 0], G: fk(238.8), f: 290, ha: 300 };
  P['pike-bot'] = { S: [10, 22], t: 312, A: ik(0, 2, -1), hn: [0, 0], G: fk(226.3), f: 290, ha: 285 };
  P['wallwalk-1'] = lean([-81, 10.4], 19.2, { A: fk(270), hn: [0, 0], f: 290, props: [wall(-79, 44, -1)] });
  P['wallwalk-2'] = lean([-79, 86], -34.1, { A: fk(270), hn: [0, 0], f: 90, props: [wall(-83, 100, -1)] });
  P['wallhs'] = { S: [0, 36], t: 264.5, A: fk(270), hn: [0, 0], G: fk(84.5), f: 90, ha: 300, props: [wall(10, 134, 1)] };
  P['hspu-bot'] = { S: [7, 20], t: 267.3, A: ik(0, 2, -1), hn: [0, 0], G: fk(87.3), f: 90, ha: 285, props: [wall(13, 134, 1)] };

  /* ---- pull / back ---- */
  P['superman'] = { H: [-10, 4], t: 2, tb: 12, A: fk(22), G: fk(172), f: 190, ha: 24 };
  P['prone-y'] = { H: [-10, 3], t: 0, tb: 8, A: fk(38), G: fk(180), f: 200, ha: 22 };
  P['snow-1'] = { H: [-10, 3], t: 0, tb: 8, A: fk(196), G: fk(180), f: 200, ha: 22, hn: [196, 196] };
  P['snow-2'] = { H: [-10, 3], t: 0, tb: 8, A: fk(30), G: fk(180), f: 200, ha: 22 };
  // vertical pole row: pole at x = 0, feet on the floor, face up
  P['prow-1'] = Object.assign(lean([30, 4], 140, { A: ik(0, 71, 1), f: 0, ha: 150 }), { props: [{ k: 'pole', x: 0, y1: 0, y2: 112 }] });
  P['prow-2'] = Object.assign(lean([30, 4], 115, { A: ik(0, 76, -1), f: 0, ha: 125 }), { props: [{ k: 'pole', x: 0, y1: 0, y2: 112 }] });

  /* ---- legs ---- */
  P['stand'] = { H: [0, 51], t: 90, A: ARMS, G: fk(270), f: 0 };
  P['squat-top'] = { H: [0, 51], t: 90, A: fk(0), G: fk(270), f: 0 };
  P['squat-bot'] = { H: [-23, 29], t: 55, tb: 14, A: fk(4), G: ik(0, 3, 1), f: 0 };
  P['bridge-down'] = { H: [0, 3], t: 180, A: fk(0), hn: [0, 0], G: ik(27, 3, 1), f: 0, ha: 160 };
  P['bridge-up'] = { S: [-31, 4], t: 213, A: fk(0), hn: [0, 0], G: ik(27, 3, 1), f: 0, ha: 160 };
  P['slbridge'] = { S: [-31, 4], t: 213, A: fk(0), hn: [0, 0], G: ik(27, 3, 1), G2: fk(30), f: 0, f2: 60, ha: 160 };
  P['split-top'] = { H: [-1, 50], t: 90, A: ARMS, G: ik(16, 3, 1), G2: ik(-33, 10.4, 1), f: 0, f2: 290 };
  P['split-bot'] = { H: [-2, 34], t: 90, A: ARMS, G: ik(22, 3, 1), G2: ik(-40, 10.4, 1), f: 0, f2: 290 };
  const bbox = [box(-62, -30, 34)];
  P['bulg-top'] = { H: [-2, 52], t: 90, A: ARMS, G: ik(16, 3, 1), G2: ik(-40, 38, 1), f: 0, f2: 180, props: bbox };
  P['bulg-bot'] = { H: [-2, 36], t: 84, A: ARMS, G: ik(20, 3, 1), G2: ik(-40, 38, 1), f: 0, f2: 180, props: bbox };
  P['shrimp-top'] = { H: [0, 51], t: 88, A: fk(0), G: fk(270), G2: ik(-13, 52, 1), f: 0 };
  P['shrimp-bot'] = { H: [-10, 29], t: 55, tb: 12, A: fk(0), G: ik(0, 3, 1), G2: fk(268, 150), f: 0, f2: 200 };
  const pbox = [box(-36, -6, 37)];

const Sync = {
  doc: null, state: 'local', dirty: false, busy: false, timer: null, ready: false, lastErr: '',
  async init() {
    if (HOSTED || this.ready || this.initing) return;

      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.doc = db.doc('data/users/' + id + '/profile');
      const snap = await this.doc.get();
      this.ready = true;
      this.state = 'synced';
      if (snap.exists) {
        const d = snap.data() || {};
        let remote = null;
        try { remote = JSON.parse(d.json); } catch (e) { remote = null; }
        if (remote && (remote.updatedAt || 0) > (S.updatedAt || 0)) {
          S = norm(remote);
          try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ }
          if (typeof afterRemote === 'function') afterRemote();
        } else if ((S.updatedAt || 0) > ((remote && remote.updatedAt) || 0)) {
          this.dirty = true; this.flush();
        }
      } else if (S.updatedAt) {
        this.dirty = true; this.flush();
      }
      if (typeof paintSync === 'function') paintSync();
    } catch (e) { this.state = 'local'; this.lastErr = String((e && e.code) || (e && e.message) || e); if (typeof paintSync === 'function') paintSync(); }
    finally { this.initing = false; }
  },

  },

  if (it) { const k = it.log.indexOf(null); if (k >= 0) return { i: A.open, k }; }
  return cursor(A);
}
function sessionStats(A) {
  let done = 0, total = 0, mainDone = 0, mainTotal = 0;
  A.items.forEach((it) => it.log.forEach((l) => {
    total++; if (l) done++;
    if (it.blk === 'main') { mainTotal++; if (l && !l.skip) mainDone++; }
  }));
  return { done, total, mainDone, mainTotal };
}
function lastResult(exId) {
  for (let i = S.hist.length - 1; i >= 0; i--) { const r = S.hist[i].res && S.hist[i].res[exId]; if (r && r.length) return r; }
  return null;
}

/* ---------- finishing a session: history, PBs, milestones, suggestions ---------- */
function finishSession() {
  const A = S.active;
  const res = {}, pbs = [], newMs = [];
  let sets = 0;
  A.items.forEach((it) => {
    if (it.blk !== 'main') return;
    const vals = [];
    it.log.forEach((l) => { if (l && !l.skip) { sets++; vals.push(l.v); } });
    if (vals.length) res[it.ex] = (res[it.ex] || []).concat(vals);
  });
  Object.keys(res).forEach((exId) => {
    const mx = Math.max.apply(null, res[exId]);
    const b = S.best[exId];
    if (mx > 0 && (!b || mx > b.v)) { if (b) pbs.push({ ex: exId, v: mx, old: b.v }); S.best[exId] = { v: mx, d: dkey() }; }
  });
  const secs = Math.min(4 * 3600, Math.round((Date.now() - A.ts) / 1000));
  const entry = { id: A.id, d: dkey(), ts: A.ts, lv: A.lv, w: A.w, name: A.name, sets, secs, res };
  if (sets > 0) {
    S.hist.push(entry);
    if (S.hist.length > 300) S.hist = S.hist.slice(-300);
    if (A.w !== 'M') { const L = lvl(A.lv); const idx = L.workouts.findIndex((w) => w.id === A.w); if (idx >= 0) S.rot[A.lv] = (idx + 1) % L.workouts.length; }
  }
  // milestone auto-check (levels up to the current one, never beyond)
  const L = lvl(A.lv);
  if (sets > 0) {
    L.ms.forEach((m) => {
      if (S.ms[m.id]) return;
      if (m.k === 'reps' || m.k === 'hold') {
        const vals = res[m.ex] || [];
        const need = m.k === 'reps' ? m.reps : m.sec;
        const good = vals.filter((v) => v >= need).length;
        if (good >= (m.sets || 1)) { S.ms[m.id] = dkey(); newMs.push(m); }
      }
    });
    const cnt = sessionsAtLevel(A.lv);
    L.ms.forEach((m) => { if (!S.ms[m.id] && m.k === 'count' && cnt >= m.n) { S.ms[m.id] = dkey(); newMs.push(m); } });
  }
  // progression suggestions: top of range on every set, in this and the previous session of the exercise
  const sugg = [];
  A.items.forEach((it) => {
    if (it.blk !== 'main') return;
    const e = EXI[it.ex];
    if (!e.up || !EXI[e.up]) return;
    const p = parseT(it.tgt);
    const cur = res[it.ex];
    if (!cur || cur.length < it.log.length || !cur.every((v) => v >= p.hi)) return;
    const prev = S.hist.slice(0, -1).reverse().find((h) => h.res && h.res[it.ex]);
    if (prev && prev.res[it.ex].length >= it.log.length && prev.res[it.ex].every((v) => v >= p.hi)) sugg.push({ from: it.ex, to: e.up, base: it.base });
  });
  S.active = null;
  commit();
  return { entry, pbs, newMs, sugg, sets };
}

/* ---------- milestones & levels ---------- */
function completeMs(id) { if (!S.ms[id]) { S.ms[id] = dkey(); commit(); } }
function undoMs(id) { if (S.ms[id]) { delete S.ms[id]; commit(); } }
function levelUp() {
  if (S.level < LEVELS.length && lvComplete(lvl())) { S.level++; S.startedOn = dkey(); commit(); return true; }
  return false;
}
function setLevel(n) { S.level = clamp(n, 1, LEVELS.length); S.startedOn = dkey(); commit(); }

/* ---------- stats ---------- */
const weekCount = (mon) => { const a = dkey(mon), b = dkey(addDays(mon, 6)); return S.hist.filter((h) => h.d >= a && h.d <= b).length; };
function streakWeeks() {
  const need = Math.min(3, Math.max(1, S.prefs.days.length));
  let m = mondayOf(new Date()), n = 0;
  if (weekCount(m) >= need) n++;
  m = addDays(m, -7);
  while (n < 520 && weekCount(m) >= need) { n++; m = addDays(m, -7); }
  return n;
}
function dayCounts() { const c = {}; S.hist.forEach((h) => { c[h.d] = (c[h.d] || 0) + 1; }); return c; }
function totalMsDone() { return Object.keys(S.ms).filter((id) => MSI[id]).length; }
function totalMs() { return Object.keys(MSI).length; }

}

/* =====================================================================
   Runner: workout session, set checklist, rest timer, hold timer, summary
   ===================================================================== */
const BLK = { wu: ['Warm-up', 'Easy and smooth. Skip it only if you are already warm'], main: ['Workout', 'Rest between sets. Stop a set when form breaks'], cool: ['Cool-down', 'Slow it down'] };
let T = null;            // hold-timer state
let restLast = null;     // last whole second beeped during rest
let SUMM = null;         // finished-session summary

/* ---------- start / open / close ---------- */
function startSession(lv, wid) {
  if (S.active) { openRunner(); toast('Resuming your workout in progress'); return; }
  S.active = buildSession(lv, wid, false);
  commit();
  Snd.init();
  openRunner();
}
function openRunner() {
  SUMM = null;
  $('#runner').hidden = false;
  Wake.on();
  renderRunner();
  const open = $('.rcard.open');
  if (open) open.scrollIntoView({ block: 'start' });
}
function minimizeRunner() { $('#runner').hidden = true; Wake.off(); render(); }

/* ---------- derived ---------- */
function curVal(it) {
  if (it.dv != null) return it.dv;
  const p = parseT(it.tgt);
  const last = [...it.log].reverse().find((l) => l && !l.skip);
  if (last && last.v != null) return last.v;
  return p.lo;
}
const stepOf = (it) => { const p = parseT(it.tgt); return p.sec && p.hi >= 30 ? 5 : 1; };
function itemDone(it) { return it.log.every((l) => l); }
function nextOpenIndex(A, from) {
  for (let j = 1; j <= A.items.length; j++) { const i = (from + j) % A.items.length; if (!itemDone(A.items[i])) return i; }
  return from;
}

/* ---------- rendering ---------- */
function renderRunner() {
  const A = S.active, R = $('#runner');
  if (SUMM) { renderSummary(); return; }
  if (!A) { R.hidden = true; return; }
  const st = sessionStats(A);
  R.innerHTML = `<header class="r-head"><button class="r-x" ${dd({ act: 'r-min' })} aria-label="Minimise">${ic('chevD', 22)}</button>
      <div class="r-title"><b>${esc(A.name)}</b><small id="rMeta">Level ${A.lv} · ${mmss((Date.now() - A.ts) / 1000)}</small></div>
      <button class="r-end" ${dd({ act: 'r-end' })}>End</button></header>
    <div class="r-prog"><i id="rBar" style="width:${Math.round((st.done / st.total) * 100)}%"></i></div>
    <div class="r-scroll" id="rScroll"><div id="rList">${listHTML()}</div></div>
    <footer class="dock" id="dock">${dockHTML()}</footer>`;
}
function listHTML() {
  const A = S.active;
  let h = '', lastBlk = null;
  A.items.forEach((it, i) => {
    if (it.blk !== lastBlk) {
      lastBlk = it.blk;
      const allWu = it.blk === 'wu' && A.items.filter((x) => x.blk === 'wu').every((x) => x.log.every((l) => l && l.skip));
      h += `<div class="blk"><div><b>${BLK[it.blk][0]}</b><small>${BLK[it.blk][1]}</small></div>${it.blk === 'wu' && !allWu && A.items.some((x) => x.blk === 'wu' && !itemDone(x)) ? btn('Skip', { act: 'r-skipwu' }, 'ghost sm') : ''}</div>`;
    }
    h += itemHTML(it, i, A);
  });
  return h;
}
function itemHTML(it, i, A) {
  const e = EXI[it.ex], p = parseT(it.tgt);
  const done = it.log.filter((l) => l).length, total = it.log.length;
  const complete = done === total;
  const sideTxt = e.s ? ' each side' : '';
  const tg = `${total} × ${tRange(p)}${p.sec ? ' s' : ''}${sideTxt}`;
  if (A.open !== i) {
    return `<button class="rc${complete ? ' done' : ''}" ${dd({ act: 'r-open', i })}><span class="rc-n">${complete ? ic('check', 15) : i + 1}</span><span class="rc-t"><b>${esc(e.n)}</b><small>${tg}</small></span><span class="rc-c">${done}/${total}</span></button>`;
  }
  const last = it.blk === 'main' ? lastResult(it.ex) : null;
  let h = `<section class="rcard open"><div class="rc-top"><div class="rc-fig">${animFig(it.ex, 1.7)}</div>
    <div class="rc-info"><b>${esc(e.n)}</b><small>${tg}${it.rest ? ' · rest ' + it.rest + ' s' : ''}</small>${last ? `<small class="lastv">Last: ${last.join(' · ')}${p.sec ? ' s' : ''}</small>` : ''}</div>
    <button class="ibtn" ${dd({ act: 'r-info', id: it.ex })} aria-label="Exercise info">${ic('info', 20)}</button></div>`;
  h += '<div class="rc-sets">';
  const firstPending = it.log.indexOf(null);
  it.log.forEach((l, k) => {
    if (l && l.skip) h += `<div class="srow skip"><span class="sn">${k + 1}</span><span class="sv">Skipped</span><button class="sx" ${dd({ act: 'r-reopen', i, k })}>Undo</button></div>`;
    else if (l) h += `<button class="srow done" ${dd({ act: 'r-reopen', i, k })}><span class="sn">${ic('check', 14)}</span><span class="sv"><b>${l.v}</b>${p.sec ? ' s' : ' reps'}${e.s ? ' each side' : ''}</span><span class="sx">Edit</span></button>`;
    else if (k === firstPending) {
      const v = curVal(it);
      h += `<div class="srow cur"><span class="sn">${k + 1}</span><div class="stepper"><button ${dd({ act: 'r-adj', i, d: -stepOf(it) })} aria-label="Less">${ic('minus', 18)}</button><span class="sval"><b id="dv">${v}</b><em>${p.sec ? 's' : 'reps'}</em></span><button ${dd({ act: 'r-adj', i, d: stepOf(it) })} aria-label="More">${ic('plus', 18)}</button></div>
        ${isTimed(it.ex) ? `<button class="tb" ${dd({ act: 'r-timer', i, k })} aria-label="Start timer">${ic('play', 20)}</button>` : ''}<button class="logb" ${dd({ act: 'r-done', i, k })} aria-label="Log set">${ic('check', 22)}</button></div>`;
    } else h += `<div class="srow wait"><span class="sn">${k + 1}</span><span class="sv">${tRange(p)}${p.sec ? ' s' : ' reps'}</span></div>`;
  });
  h += '</div>';
  const foot = [];
  if (done === 0 && it.blk === 'main') {
    if (e.dn && EXI[e.dn]) foot.push(`<button class="swchip" ${dd({ act: 'r-swap', i, to: e.dn })}>${ic('down', 14)} Easier: ${esc(EXI[e.dn].n)}</button>`);
    if (e.up && EXI[e.up]) foot.push(`<button class="swchip" ${dd({ act: 'r-swap', i, to: e.up })}>${ic('up', 14)} Harder: ${esc(EXI[e.up].n)}</button>`);
    if (it.ex !== it.base) foot.push(`<button class="swchip" ${dd({ act: 'r-swap', i, to: it.base })}>${ic('undo', 14)} Planned: ${esc(EXI[it.base].n)}</button>`);
  }
  if (firstPending >= 0) foot.push(`<button class="swchip" ${dd({ act: 'r-skipset', i, k: firstPending })}>${ic('skip', 14)} Skip set</button>`);
  if (foot.length) h += `<div class="rc-foot">${foot.join('')}</div>`;
  return h + '</section>';
}
function dockHTML() {
  const A = S.active;
  const cur = openCursor(A) || cursor(A);
  const resting = A.rest && A.rest.endAt > Date.now();
  let h = '';
  if (resting) {
    const rem = Math.ceil((A.rest.endAt - Date.now()) / 1000);
    h += `<div class="dock-rest"><div class="rring"><svg viewBox="0 0 48 48"><circle class="rbg" cx="24" cy="24" r="20"/><circle class="rfg" id="rRing" cx="24" cy="24" r="20" stroke-dasharray="125.66" stroke-dashoffset="${(125.66 * (1 - clamp(rem / A.rest.dur, 0, 1))).toFixed(2)}"/></svg></div>
      <div class="rt"><small>REST</small><b id="rDig">${mmss(rem)}</b></div>
      <div class="rb"><button class="rbtn" ${dd({ act: 'r-rest-add', d: -15 })}>−15</button><button class="rbtn" ${dd({ act: 'r-rest-add', d: 15 })}>+15</button><button class="btn primary sm" ${dd({ act: 'r-rest-skip' })}>Skip</button></div></div>`;
    if (cur) { const it = A.items[cur.i]; h += `<div class="dock-next">Up next: <b>${esc(EXI[it.ex].n)}</b> · set ${cur.k + 1} of ${it.log.length}</div>`; }
    return h;
  }
  if (!cur) return `<button class="btn primary big" ${dd({ act: 'r-finish' })}>${ic('flag', 20)} Finish workout</button>`;
  const it = A.items[cur.i], e = EXI[it.ex];
  const timed = isTimed(it.ex);
  const label = timed ? `${ic('play', 20)} Start timer` : `${ic('check', 20)} Log ${curVal(it)} reps`;
  h += `<div class="dock-next">${esc(e.n)} · set ${cur.k + 1} of ${it.log.length}</div>
    <button class="btn primary big" ${dd({ act: timed ? 'r-timer' : 'r-done', i: cur.i, k: cur.k })}>${label}</button>`;

function repaintRunner(scroll) {
  if (!S.active || $('#runner').hidden || SUMM) return;
  const st = sessionStats(S.active);
  const l = $('#rList'), d = $('#dock'), b = $('#rBar');
  if (l) l.innerHTML = listHTML();

/* ---------- actions ---------- */
function advanceFrom(i) {
  const A = S.active, it = A.items[i];
  if (itemDone(it)) { const n = nextOpenIndex(A, i); A.open = n; return true; }
  return false;
}
function logSet(i, k, v) {
  const A = S.active, it = A.items[i];
  if (!it || it.log[k]) return;
  it.log[k] = { v, ts: Date.now() };
  it.dv = null;
  const adv = advanceFrom(i);
  const anyLeft = !!cursor(A);
  if (it.rest > 0 && anyLeft) { A.rest = { endAt: Date.now() + it.rest * 1000, dur: it.rest }; restLast = null; } else A.rest = null;
  Snd.vib(25);
  commit();
  repaintRunner(adv);
}
function skipSet(i, k) {

const RING = 628.32;
function openTimer(o) {

        switchSec: e.c === 'flag' ? 15 : 5, acc: 0, t0: performance.now(), last: null, iv: null, label: o.label || '' };
  const prep = e.t === 'hold' ? S.prefs.prep : 0;
  T.phase = prep > 0 ? 'prep' : 'hold';
  T.dur = prep > 0 ? prep : T.target;
  Snd.init(); Wake.on();
  $('#timer').hidden = false;
  renderTimer();
  T.iv = setInterval(tickTimer, 100);

}
function closeTimer(silent) {

}
function elapsed() { return T.acc + (T.paused ? 0 : (performance.now() - T.t0) / 1000); }

  if (rem <= 0) { phaseEnd(true); return; }
  paintTimer(rem, el);
}
function phaseEnd(natural) {
  if (!T) return;
  if (T.phase === 'prep') { Snd.go(); Snd.vib(100); startPhase('hold', T.target); return; }
  if (T.phase === 'hold') {
    const held = natural ? T.target : Math.min(T.target, Math.floor(elapsed()));
    T.res[T.side] = held;
    if (natural) { Snd.go(); Snd.vib([120, 60, 120]); }
    if (T.side < T.sides - 1) { T.side++; startPhase('switch', T.switchSec); return; }
    T.phase = 'done'; clearInterval(T.iv); Snd.chime(); renderTimer(); return;
  }

}
function paintTimer(rem, el) {

}
function timerTitle() {

function renderTimer() {

    const isFlagish = e.c === 'flag';

      <div class="t-ring"><svg viewBox="0 0 220 220"><circle class="tbg" cx="110" cy="110" r="100"/><circle class="tfg" id="tRing" cx="110" cy="110" r="100" stroke-dasharray="${RING}" stroke-dashoffset="0"/></svg>
        <div class="t-c"><small id="tPhase">${lab}</small><b id="tDig">${T.dur}</b><small id="tSub">${ph === 'hold' ? 'held 0 s' : ph === 'prep' ? 'starts in' : 'next side in'}</small></div></div>

/* =====================================================================
   Host: extras for the standalone website build (GitHub Pages).
   Install prompt and offline service worker. Everything here is inert
   when HOSTED is false (the Claude artifact build).
   ===================================================================== */
const Host = {
  deferred: null, // the browser's native install prompt (Chrome, Edge, Android), when it offers one
  standalone() {
    try { return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; } catch (e) { return false; }
  },
  ios() {
    const u = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(u) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  },
  touch() { try { return !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches); } catch (e) { return false; } },
  hidden() { try { return localStorage.getItem('flagline.hideInstall') === '1'; } catch (e) { return false; } },
  hide() { try { localStorage.setItem('flagline.hideInstall', '1'); } catch (e) { /* ignore */ } },
  // can we help the person install it at all (website build, not already installed)?
  canOffer() { return HOSTED && !this.standalone(); },
  // the Today-tab card: only after onboarding, and only where we can really help
  showCard() { return this.canOffer() && !this.hidden() && !!S.prefs.onboarded && (this.ios() || (!!this.deferred && this.touch())); },
  async install() {
    const p = this.deferred;
    if (!p) return false;
    this.deferred = null;
    try { p.prompt(); const r = await p.userChoice; return !!r && r.outcome === 'accepted'; } catch (e) { return false; }
  },
  start() {
    if (!HOSTED) return;
    window.addEventListener('beforeinstallprompt', (ev) => {
      ev.preventDefault(); this.deferred = ev;
      if (UI.tab === 'today' || UI.tab === 'progress') render(true);
    });
    window.addEventListener('appinstalled', () => { this.deferred = null; this.hide(); render(true); });
    if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
    // a new service worker taking over after the first visit means a new version was published
    let had = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had) toast('New version ready. Reload to update'); had = true; });
    const reg = () => { navigator.serviceWorker.register('./sw.js').catch(() => { /* offline support is a bonus, never fatal */ }); };
    if (document.readyState === 'complete') reg(); else window.addEventListener('load', reg);
  }
};

  'install-go'() { Host.install().then((ok) => { closeSheet(); if (ok) toast('Installing Flagline…'); render(true); }); },
  'install-hide'() { Host.hide(); render(true); toast('Hidden. Find it under Progress, Settings'); },
  'reset-yes'() { S = blank(); commit(); $('#runner').hidden = true; SUMM = null; closeSheet(); UI.bkOpen = false; UI.backup = ''; UI.open = {}; toast('All data reset'); render(false); },

  /* runner */
  'r-open'(el) { S.active.open = +el.dataset.i; commit(); repaintRunner(true); },
  'r-adj'(el) { adjVal(+el.dataset.i, +el.dataset.d); },
  'r-done'(el) { const i = +el.dataset.i, k = +el.dataset.k; logSet(i, k, curVal(S.active.items[i])); },
  'r-timer'(el) { startTimerForSet(+el.dataset.i, +el.dataset.k); },
  'r-skipset'(el) { skipSet(+el.dataset.i, +el.dataset.k); },
  'r-reopen'(el) { reopenSet(+el.dataset.i, +el.dataset.k); },
  'r-swap'(el) { swapItem(+el.dataset.i, el.dataset.to); },
  'r-skipwu'() { skipWarmup(); },
  'r-rest-add'(el) { addRest(+el.dataset.d); },
  'r-rest-skip'() { endRest(false); },
  'r-finish'() { doFinish(); },
  'r-end'() { endSheet(); },
  'r-finish-now'() { doFinish(); },
  'r-discard'() { discardSession(); },
  'r-min'() { minimizeRunner(); },
  'r-close'() { SUMM = null; $('#runner').hidden = true; render(true); },
  'r-info'(el) { sheetEx(el.dataset.id); },
  'swap-in'(el) { S.swaps[el.dataset.base] = el.dataset.to; commit(); toast('Swapped in ' + EXI[el.dataset.to].n); if (SUMM) renderSummary(); },

  /* timer */
  't-pause'() { timerPause(); },
  't-stop'() { phaseEnd(false); },
  't-skip'() { phaseEnd(false); },
  't-save'() { timerSave(); },
  't-redo'() { timerRedo(); },
  't-close'() { closeTimer(false); },
  't-mark'() { timerMark(); }
};

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  Snd.init();
  const fn = ACT[el.dataset.act];
  if (fn) { try { fn(el, ev); } catch (e) { console.error(e); toast('Something went wrong'); } }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearTimeout(Sync.timer); Sync.flush(); }
  else if (!Sync.ready && Sync.lastErr) Sync.init();
});
document.addEventListener('input', (ev) => { if (ev.target && ev.target.id === 'libq') { UI.libQ = ev.target.value; refreshLib(); } });

const TABS = [['today', 'Today', 'bolt'], ['path', 'Path', 'stairs'], ['library', 'Library', 'grid'], ['progress', 'Progress', 'chart']];
function init() {
  $('#tabs').innerHTML = TABS.map((t) => `<button data-act="tab" data-tab="${t[0]}" role="tab" aria-selected="false">${ic(t[2], 22)}<span>${t[1]}</span></button>`).join('');
  if (S.active && S.active.rest && S.active.rest.endAt <= Date.now()) S.active.rest = null;
  render(false);
  setInterval(runnerTick, 250);
  Sync.init();
  Host.start();
}
init();

</script>
</body>
</html>
